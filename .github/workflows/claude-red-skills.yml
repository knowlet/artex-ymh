name: Claude-Red skill integrity

on:
  pull_request:
    paths:
      - "skills/**"
      - "packaging/claude-red.lock.json"
      - "tools/claude_red_skills_test.go"
      - "third_party/claude-red/**"
      - ".github/workflows/claude-red-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packaging/claude-red.lock.json"
      - "tools/claude_red_skills_test.go"
      - "third_party/claude-red/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.3"
          cache: true
      - name: Validate pinned sources and ARTEX Skill loader
        run: go test ./tools -run '^TestClaudeRedSkills$' -count=1 -v
