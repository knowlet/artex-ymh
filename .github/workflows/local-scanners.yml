name: managed local scanners
on:
  pull_request:
    paths:
      - 'localscan/**'
      - 'cmd/artex/scan.go'
      - 'cmd/artex/main.go'
      - 'scripts/*local_scanners.py'
      - 'scripts/build_tools_bundle.py'
      - 'packaging/scanner-source-index.json'
      - 'docs/LOCAL-SCANNERS.md'
      - '.github/workflows/local-scanners.yml'
permissions:
  contents: read
concurrency:
  group: local-scanners-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts-and-real-binaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install sandbox on this disposable runner only
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          /usr/bin/bwrap --version
          /usr/bin/prlimit --version
      - name: Offline contracts and unchanged bundle regression tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s localscan -p 'test_*.py' -v 2>&1 | tee /tmp/local-python-tests.log
          python3 -m unittest discover -s scripts -p 'test_build_tools_bundle.py' -v
          python3 scripts/install_local_scanners.py --cache /tmp/source-cache --validate
          go test -race ./localscan -count=1 2>&1 | tee /tmp/local-go-tests.log
          go vet ./localscan
          go build -o /tmp/artex-local-scan ./cmd/artex
          /tmp/artex-local-scan scan --help
      - name: Real verified installation and no-network local scans
        run: python3 scripts/verify_local_scanners.py /tmp/artex-local-scan /tmp/local-scanner-evidence
      - name: Preserve actual evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-scanner-evidence-${{ github.sha }}
          path: |
            /tmp/local-scanner-evidence
            /tmp/local-python-tests.log
            /tmp/local-go-tests.log
          if-no-files-found: error
          retention-days: 14
