name: approval advisory

on:
  pull_request:
    paths:
      - 'approvalreview/**'
      - 'db/**'
      - 'intercept/**'
      - 'server/**'
      - 'web/**'
      - 'docs/APPROVAL-ADVISORY.md'
      - '.github/workflows/approval-advisory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approval-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record exact tested source without credentials or runtime data
        run: |
          set -euo pipefail
          mkdir -p /tmp/approval-evidence
          git rev-parse HEAD > /tmp/approval-evidence/commit.txt
          git rev-parse HEAD^{tree} > /tmp/approval-evidence/tree.txt
          git archive --format=tar.gz --output=/tmp/approval-evidence/source.tar.gz HEAD
          (cd /tmp/approval-evidence && sha256sum source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approval-advisory-source
          path: /tmp/approval-evidence/
          retention-days: 7
          if-no-files-found: error
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: artex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:disposable_test_password@localhost:5432/artex_test?sslmode=disable
      ARTEX_AUTH_TEST_DSN: postgres://artex_test:disposable_test_password@localhost:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Advisory safety and integration regressions
        run: |
          set -euo pipefail
          test -f approvalreview/review_test.go
          test -f server/approval_advisory_test.go
          go test -race -count=1 -p=1 -timeout=10m ./approvalreview ./db ./intercept ./server -run 'TestApprovalAdvisory'
          go vet ./approvalreview ./db ./intercept ./server
          go build ./cmd/artex
      - name: Frontend type check
        working-directory: web
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install tsc --noEmit
