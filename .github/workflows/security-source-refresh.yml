name: scheduled CVE and scanner toolchain refresh

on:
  schedule:
    # 09:17 Asia/Taipei daily. GitHub's scheduled execution may be delayed.
    - cron: "17 1 * * *"
  workflow_dispatch:

# Only run repository-owned main: never execute a PR's untrusted refresh code
# with a token that can create branches or pull requests.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: artex-security-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted main without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go for offline runtime checks
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh validated public sources (never execute external tools)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/update_vulnerability_intel.py
          python3 scripts/update_projectdiscovery.py
          python3 scripts/update_nuclei_index.py
          python3 scripts/sync_projectdiscovery_bundle.py
          python3 scripts/update_scanner_sources.py
          python3 scripts/build_intel_pack.py
      - name: Verify all updated source contracts
        run: |
          set -euo pipefail
          python3 scripts/update_projectdiscovery.py --validate
          python3 scripts/sync_projectdiscovery_bundle.py --validate
          python3 scripts/update_scanner_sources.py --validate
          python3 scripts/build_intel_pack.py --check
          python3 scripts/build_tools_bundle.py --validate
          python3 -m unittest discover -s scripts -p 'test_update_vulnerability_intel.py' -v
          python3 -m unittest discover -s scripts -p 'test_update_projectdiscovery.py' -v
          python3 -m unittest discover -s scripts -p 'test_update_nuclei_index.py' -v
          python3 -m unittest discover -s scripts -p 'test_build_intel_pack.py' -v
          python3 -m unittest discover -s scripts -p 'test_sync_projectdiscovery_bundle.py' -v
          python3 -m unittest discover -s scripts -p 'test_update_scanner_sources.py' -v
          python3 -m unittest discover -s scripts -p 'test_build_tools_bundle.py' -v
      - name: Verify Go offline discovery, intel and tool contracts
        run: |
          set -euo pipefail
          go test -race ./intelpack ./discovery ./tools -count=1
          go test ./cmd/artex/intel.go ./cmd/artex/intel_test.go -count=1
          go test ./cmd/artex/discovery.go ./cmd/artex/discovery_test.go -count=1
      - name: Rebuild and verify the pinned tool archive if source locks changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packaging/tools-sources.lock.json; then
            echo "No changed bundled scanner source pins; existing artifact CI remains authoritative."
            exit 0
          fi
          # The archive builder validates checksums and ELF architecture without
          # running downloaded binaries or scanners against external targets.
          python3 scripts/build_tools_bundle.py
          python3 scripts/build_tools_bundle.py --verify images/tools.tar.gz
      - name: Show source differences for human review
        run: |
          set -euo pipefail
          git diff --stat -- packaging/
          git status --short
      - name: Propose review-only source update (never merge or deploy)
        id: update-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.SECURITY_REFRESH_TOKEN || github.token }}
          branch: automation/security-source-refresh
          base: main
          commit-message: "chore(security): refresh CVE intelligence and verified scanner pins"
          title: "chore(security): refresh CVE intelligence and scanner source pins"
          body: |
            Automated proposal from the scheduled source-refresh workflow.

            Sources: official CISA KEV, ProjectDiscovery stable releases and
            Nuclei CVE template metadata, plus allowlisted maintained security
            scanner project releases/commits. Where relevant, update the
            pinned naabu/httpx/katana tool bundle inputs and rebind the
            offline data manifest.

            Gate results are in the originating workflow run. Review
            provenance, newly added CVEs, template risk classifications,
            release notes, licenses, bundle differences and false positives
            before merging. No PoC, executable template, scanner command,
            deployment, or production test was run by the refresh process.
            Installing scanners or changing ARTEX tool permissions is separate.
          labels: |
            dependencies
          add-paths: |
            packaging/vulnerability-intel.json
            packaging/projectdiscovery-lock.json
            packaging/nuclei-cve-index.json
            packaging/discovery-data-manifest.json
            packaging/tools-sources.lock.json
            packaging/scanner-source-index.json
          delete-branch: true
      - name: Show PR and permissions result
        if: always()
        env:
          PR_URL: ${{ steps.update-pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Review-only PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No PR created. If source files changed, check that Actions is allowed to create PRs or provide SECURITY_REFRESH_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi
