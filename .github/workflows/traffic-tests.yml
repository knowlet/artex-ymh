name: traffic tests
on:
  pull_request:
    paths:
      - 'traffic/**'
      - 'db/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/traffic-tests.yml'
permissions:
  contents: read
concurrency:
  group: traffic-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Permission migration regression
        run: go test ./traffic -run '^TestOpenTightensPermissions$' -count=10 -v
      - name: Full traffic package
        run: go test ./traffic -count=1
