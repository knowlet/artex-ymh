name: AntiFox integration tests
on:
  pull_request:
    paths:
      - 'providers/antifox/**'
      - 'skills/antifox-*/**'
      - 'skillknowledge/**'
      - 'skillcheck/antifox_test.go'
      - 'agent/toolcatalog.go'
      - 'db/db.go'
      - 'db/config.go'
      - 'db/skill_visibility_revoke_test.go'
      - 'server/assembly.go'
      - 'server/knowledge_integration_test.go'
      - 'scripts/*sync_antifox*'
      - 'scripts/test_discovery_distribution.py'
      - 'build.sh'
      - 'Dockerfile'
      - 'Dockerfile.source'
      - '.github/workflows/antifox-tests.yml'
permissions:
  contents: read
concurrency:
  group: antifox-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: artex_antifox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_antifox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:fixture-only@127.0.0.1:5432/artex_antifox?sslmode=disable
      ARTEX_ANTIFOX_REQUIRE_PG: '1'
      ARTEX_PROVIDER_REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pinned source and deterministic adapters
        run: |
          python3 scripts/sync_antifox.py --check
          python3 -m unittest discover -s scripts -p test_sync_antifox.py -v
          python3 -m unittest discover -s scripts -p test_discovery_distribution.py -v
      - name: Real Norma and bounded read-only retrieval
        run: go test -race ./skillknowledge ./skillcheck -count=1 -v
      - name: Real PostgreSQL visibility and tool bindings
        run: |
          go test -race ./db -run '^(TestBuiltinSkillRevocationSurvivesStartup|TestSkillRevocationDoesNotTouchAnotherLibrary)$' -count=1 -v
          go test -race ./server -run '^(TestAntiFoxKnowledgeVisibilityPG|TestProviderVisibilityAndMeteringPG)$' -count=1 -v
      - name: Catalog, existing tool contracts and build
        run: |
          go test ./agent -run '^(TestBuiltinToolSeeds|TestDomainToolsSurviveNilStores)$' -count=1
          go vet ./skillknowledge ./skillcheck ./agent ./server
          go build -o "$RUNNER_TEMP/artex" ./cmd/artex
