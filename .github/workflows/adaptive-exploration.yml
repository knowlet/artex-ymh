name: Adaptive exploration
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'db/**'
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/adaptive-exploration.yml'
      - 'scripts/assert_go_test_results.py'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'db/**'
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/adaptive-exploration.yml'
      - 'scripts/assert_go_test_results.py'
permissions:
  contents: read
concurrency:
  group: adaptive-exploration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: artex_adaptive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex_test -d artex_adaptive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex_test:fixture-only@127.0.0.1:5432/artex_adaptive?sslmode=disable
      ARTEX_ADAPTIVE_REQUIRE_PG: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l agent/assembly.go agent/deferred.go agent/capabilityguidance*.go agent/intent_exploration*.go agent/planner*.go agent/worker_feedback*.go agent/toolcatalog.go agent/tools.go agent/worker.go db/worker_feedback*.go server/assembly.go server/capabilityinventory*.go server/orchestration.go server/server.go)
          test -z "$unformatted"
      - name: Model fixtures and real PostgreSQL regressions
        run: |
          set -euo pipefail
          go test -race -count=1 -p=1 -timeout=8m -json ./db ./agent ./server \
            -run '^(TestPlannerAdaptive|TestIntentExploration|TestWorkerFeedback|TestWorkerOutput|TestRecentWorkerFeedback|TestCapabilityGuidance|TestWorkerCapabilityInventory|TestSkillGatedDiscovery)' \
            | tee "$RUNNER_TEMP/adaptive-exploration.jsonl"
          python3 scripts/assert_go_test_results.py "$RUNNER_TEMP/adaptive-exploration.jsonl" \
            github.com/Autumn-27/artex/db \
            TestWorkerOutputLatestBeyondInitialPage \
            TestWorkerOutputInheritedTerminalBoundary \
            TestRecentWorkerFeedbackBoundedAndFactual
          python3 scripts/assert_go_test_results.py "$RUNNER_TEMP/adaptive-exploration.jsonl" \
            github.com/Autumn-27/artex/agent \
            TestCapabilityGuidanceFinalResolvedTools \
            TestCapabilityGuidanceUnavailableRoutes \
            TestIntentExplorationPersistsAndReachesWorker \
            TestIntentExplorationRejectsInvalidReferencesWithoutWrites \
            TestIntentExplorationSchemaPreservesOverrides \
            TestIntentExplorationCompactBounds \
            TestWorkerFeedbackOverviewSurvivesHeartbeat \
            TestWorkerFeedbackToolPreservesInheritedBoundary \
            TestPlannerAdaptiveDigestPreservesDistinctEvidence \
            TestPlannerAdaptiveDigestPairsParallelResultsAndRedacts \
            TestPlannerAdaptiveBatchErrors \
            TestPlannerAdaptiveRecoveryExploresThenCommits \
            TestPlannerAdaptiveRecoveryKeepsTaskDeadline
          python3 scripts/assert_go_test_results.py "$RUNNER_TEMP/adaptive-exploration.jsonl" \
            github.com/Autumn-27/artex/server \
            TestWorkerCapabilityInventoryMetadata \
            TestWorkerCapabilityInventoryPaginationAndBounds \
            TestWorkerCapabilityInventoryFailsClosed \
            TestSkillGatedDiscoveryPrerequisites \
            TestWorkerCapabilityInventoryBindingsPG
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adaptive-exploration-test-results
          path: ${{ runner.temp }}/adaptive-exploration.jsonl
          if-no-files-found: error
          retention-days: 7
